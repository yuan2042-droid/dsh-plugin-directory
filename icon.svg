<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#8ceaff"/>
      <stop offset="0.45" stop-color="#48bdf6"/>
      <stop offset="1" stop-color="#2b73d8"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd8fa"/>
      <stop offset="1" stop-color="#2f7fe0"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#e6f6ff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.33" cy="0.26" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#102a3f" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- 尾巴 -->
    <path d="M150 268 C120 230 78 208 42 210 C63 243 63 293 42 326 C80 328 124 306 150 268 Z" fill="url(#fin)"/>
    <!-- 背鳍 -->
    <path d="M236 154 C248 108 278 84 314 90 C302 118 302 144 308 164 Z" fill="url(#fin)"/>
    <!-- 身体 -->
    <ellipse cx="276" cy="268" rx="150" ry="130" fill="url(#body)"/>
  </g>

  <!-- 肚皮 -->
  <ellipse cx="274" cy="312" rx="102" ry="74" fill="url(#belly)"/>
  <!-- 高光 -->
  <ellipse cx="276" cy="268" rx="150" ry="130" fill="url(#shine)"/>


  <!-- 眼睛 -->
  <g>
    <circle cx="300" cy="236" r="33" fill="#ffffff" stroke="#102a3f" stroke-width="11"/>
    <circle cx="378" cy="236" r="33" fill="#ffffff" stroke="#102a3f" stroke-width="11"/>
    <circle cx="307" cy="243" r="15" fill="#12283d"/>
    <circle cx="385" cy="243" r="15" fill="#12283d"/>
    <circle cx="301" cy="236" r="6" fill="#ffffff"/>
    <circle cx="379" cy="236" r="6" fill="#ffffff"/>
  </g>

  <!-- 腮红 -->
  <ellipse cx="276" cy="300" rx="24" ry="13" fill="#ff8fb0" opacity="0.5"/>
  <ellipse cx="384" cy="300" rx="22" ry="12" fill="#ff8fb0" opacity="0.5"/>

  <!-- 嘴 -->
  <path d="M320 292 Q344 316 368 292" fill="none" stroke="#102a3f" stroke-width="12" stroke-linecap="round"/>

  <!-- 气泡 -->
  <g fill="#d8f3ff" opacity="0.85" stroke="#8fdcff" stroke-width="5">
    <circle cx="446" cy="142" r="13"/>
    <circle cx="474" cy="104" r="8"/>
    <circle cx="462" cy="180" r="6"/>
  </g>
</svg>
